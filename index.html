<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>معايدة نوف</title>
<style>
body{
    margin:0;
    background:black;
    overflow:hidden;
    font-family:Tahoma;
}

#text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    text-align:center;
    font-size:55px;
    text-shadow:0 0 20px rgb(247, 81, 158),0 0 50px rgb(247, 81, 158);
    opacity:0;
    transition:opacity 2s ease;
    z-index:2;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}
</style>
</head>
<body>

<div id="text">
✨ كل عام وأنتم بخير ✨<br><br>
!!!!👩‍💻 معايدة نوف دايم الأفضل
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const text = document.getElementById("text");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let rockets = [];
let particles = [];

function launchRocket(){
    rockets.push({
        x: Math.random()*canvas.width,
        y: canvas.height,
        speed: Math.random()*3+4,
        color: "hsl(" + Math.random()*360 + ",100%,60%)"
    });
}

function explode(x,y,color){
    for(let i=0;i<150;i++){
        particles.push({
            x:x,
            y:y,
            angle:Math.random()*2*Math.PI,
            speed:Math.random()*6+2,
            life:100,
            color:color
        });
    }
}

function update(){
    ctx.fillStyle="rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    rockets.forEach((r,i)=>{
        r.y -= r.speed;
        ctx.beginPath();
        ctx.arc(r.x,r.y,3,0,Math.PI*2);
        ctx.fillStyle=r.color;
        ctx.fill();

        if(r.y < canvas.height/3){
            explode(r.x,r.y,r.color);
            rockets.splice(i,1);
        }
    });

    particles.forEach((p,i)=>{
        p.x += Math.cos(p.angle)*p.speed;
        p.y += Math.sin(p.angle)*p.speed;
        p.life--;

        ctx.beginPath();
        ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.fillStyle=p.color;
        ctx.fill();

        if(p.life<=0){
            particles.splice(i,1);
        }
    });

    requestAnimationFrame(update);
}

setInterval(launchRocket,400);
update();

// إظهار النص بعد 3 ثواني
setTimeout(()=>{
    text.style.opacity = 1;
},3000);

</script>

</body>
</html>
